name: stitchra

services:
  nginx:
    image: nginx:1.29-alpine
    container_name: stitchra-nginx
    ports:
      - "80:80"      # web (Next.js)
      - "8000:8000"  # api (Laravel)
      - "8080:8080"  # reverb (websocket)
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../apps/api/public:/var/www/api/public:ro
    depends_on: [web, api, reverb]
    networks: [stitchra]
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
    container_name: stitchra-web
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=http://localhost:8080
    networks: [stitchra]
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    container_name: stitchra-api
    volumes:
      - ../apps/api:/var/www/html
    depends_on: [mysql, redis]
    networks: [stitchra]
    restart: unless-stopped

  horizon:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    container_name: stitchra-horizon
    command: php artisan horizon
    volumes:
      - ../apps/api:/var/www/html
    depends_on: [api, redis]
    networks: [stitchra]
    restart: unless-stopped

  reverb:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    container_name: stitchra-reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ../apps/api:/var/www/html
    depends_on: [api, redis]
    networks: [stitchra]
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: stitchra-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-stitchra}
      MYSQL_USER: ${DB_USERNAME:-stitchra}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    command: --transaction-isolation=READ-COMMITTED
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [stitchra]
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: stitchra-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [stitchra]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: stitchra-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-stitchra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-stitchra_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks: [stitchra]
    restart: unless-stopped

networks:
  stitchra:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  minio_data:
