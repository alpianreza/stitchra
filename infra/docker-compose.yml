name: stitchra

# Shared env untuk service berbasis image api (api + reverb).
# CATATAN: nilai ini adalah default DEV on-prem. Untuk produksi: pakai secret management
# dan rotasi APP_KEY/password (lihat CONTAINERIZATION.md bagian Production Considerations).
x-api-env: &api-env
  APP_NAME: Stitchra
  APP_ENV: local
  APP_DEBUG: "true"
  APP_KEY: base64:F+WYG7ZwDh5KP9vZGmBoM6QD0UJUBKgneLkm34XgnNs=
  APP_URL: http://localhost:8001
  APP_TIMEZONE: Asia/Jakarta
  LOG_CHANNEL: stack
  LOG_LEVEL: debug
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: stitchra
  DB_USERNAME: stitchra
  DB_PASSWORD: stitchra_secret
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: stitchra
  REVERB_APP_KEY: stitchra-dev-key
  REVERB_APP_SECRET: stitchra-dev-secret
  REVERB_HOST: reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  FILESYSTEM_DISK: s3
  AWS_ACCESS_KEY_ID: stitchra
  AWS_SECRET_ACCESS_KEY: stitchra_secret
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: stitchra
  AWS_ENDPOINT: http://minio:9000
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  SANCTUM_STATEFUL_DOMAINS: "localhost,127.0.0.1,localhost:3000,localhost:8001"
  SANCTUM_TOKEN_EXPIRATION: "480"
  SANCTUM_TOKEN_PREFIX: stitchra_
  FRONTEND_URL: http://localhost
  MASTER_IMPORT_MAX_ROWS: "10000"
  TELESCOPE_ENABLED: "false"

services:
  mysql:
    image: mysql:8.4
    container_name: stitchra-mysql
    environment:
      MYSQL_ROOT_PASSWORD: stitchra_root_secret
      MYSQL_DATABASE: stitchra
      MYSQL_USER: stitchra
      MYSQL_PASSWORD: stitchra_secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3307:3306"   # 3306 di host dipakai MySQL XAMPP
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - stitchra
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: stitchra-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stitchra
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: stitchra-minio
    environment:
      MINIO_ROOT_USER: stitchra
      MINIO_ROOT_PASSWORD: stitchra_secret
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - stitchra
    restart: unless-stopped

  # One-shot: buat bucket S3 "stitchra" (idempoten)
  minio-init:
    image: minio/mc:latest
    container_name: stitchra-minio-init
    depends_on:
      - minio
    environment:
      MINIO_USER: stitchra
      MINIO_PASS: stitchra_secret
    entrypoint: ["/bin/sh", "-c"]
    command: "i=0; until mc alias set local http://minio:9000 \"$$MINIO_USER\" \"$$MINIO_PASS\" >/dev/null 2>&1; do i=$$((i+1)); [ $$i -ge 30 ] && echo 'minio-init: timeout menunggu MinIO' && exit 1; sleep 2; done; mc mb --ignore-existing local/stitchra && echo 'minio-init: bucket stitchra siap'"
    networks:
      - stitchra
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    image: stitchra-api:latest
    container_name: stitchra-api
    environment: *api-env
    ports:
      - "8001:80"     # 8000 di host dipakai proses php.exe (milik user)
    volumes:
      - api_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stitchra
    restart: unless-stopped

  # Websocket server (Laravel Reverb) - image sama dengan api
  reverb:
    image: stitchra-api:latest
    container_name: stitchra-reverb
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment: *api-env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - stitchra
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001
    image: stitchra-web:latest
    container_name: stitchra-web
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "3000:3000"
    networks:
      - stitchra
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: stitchra-nginx
    volumes:
      - ./nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - web
    networks:
      - stitchra
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  minio_data:
  api_storage:

networks:
  stitchra:
    driver: bridge