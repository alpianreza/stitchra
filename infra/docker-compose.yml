version: '3.9'

services:
  # MySQL Database
  mysql:
    image: mysql:latest
    container_name: stitchra-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stitchra
      MYSQL_USER: stitchra
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stitchra

  # Redis Cache & Queue
  redis:
    image: redis:8-alpine
    container_name: stitchra-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stitchra

  # MinIO S3-compatible Storage
  minio:
    image: minio/minio:latest
    container_name: stitchra-minio
    environment:
      MINIO_ROOT_USER: stitchra
      MINIO_ROOT_PASSWORD: stitchra_secret
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stitchra

  # Laravel API
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: stitchra-api
    environment:
      APP_ENV: local
      APP_DEBUG: true
      LOG_CHANNEL: stack
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: stitchra
      DB_USERNAME: stitchra
      DB_PASSWORD: secret
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: stitchra
      REVERB_APP_KEY: stitchra-key
      REVERB_APP_SECRET: stitchra-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: stitchra
      AWS_SECRET_ACCESS_KEY: stitchra_secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: stitchra
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: true
      SANCTUM_STATEFUL_DOMAINS: localhost,127.0.0.1
      FRONTEND_URL: http://localhost
      TELESCOPE_ENABLED: false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:80"
      - "9000:9000"
    volumes:
      - ./apps/api:/app
      - api_storage:/app/storage
    networks:
      - stitchra
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Next.js Web
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: stitchra-web
    environment:
      NODE_ENV: production
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/.next
    networks:
      - stitchra
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx Reverse Proxy (optional, for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: stitchra-nginx
    volumes:
      - ./infra/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - web
    networks:
      - stitchra

volumes:
  mysql_data:
  redis_data:
  minio_data:
  api_storage:

networks:
  stitchra:
    driver: bridge
