name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    name: API — Pest (MySQL 8.4 + Redis)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_secret
          MYSQL_DATABASE: stitchra_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, intl, zip, gd, bcmath, pcntl, redis
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist

      - name: Prepare env
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: stitchra_test
          DB_USERNAME: root
          DB_PASSWORD: root_secret
          REDIS_HOST: 127.0.0.1

      - name: Migrate + Seed
        working-directory: apps/api
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: stitchra_test
          DB_USERNAME: root
          DB_PASSWORD: root_secret
          REDIS_HOST: 127.0.0.1
        run: php artisan migrate --seed --force

      - name: Run Pest
        working-directory: apps/api
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: stitchra_test
          DB_USERNAME: root
          DB_PASSWORD: root_secret
          REDIS_HOST: 127.0.0.1
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          TELESCOPE_ENABLED: 'false'
        run: ./vendor/bin/pest --colors=always

  web-build:
    name: Web — Next.js build check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Lint + Build
        working-directory: apps/web
        run: npm run build

  # E2E (Playwright) diaktifkan setelah halaman login web selesai.
  # Sengaja dipisah agar CI hijau sejak awal tanpa UI.
